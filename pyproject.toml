[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-vault-udp"
version = "0.2.0"
description = "Python UDP communication library with opportunistic, anonymous encryption, automatic key exchange, message compression, and rate limiting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "msgpack",
    "pyzstd",
    "psutil",
    "psygnal>=0.10",
    "PyNaCl>=1.6.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "types-psutil"]

[tool.setuptools]
py-modules = ["vault_ip", "vault_udp_encryption", "vault_udp_socket_helper", "vault_udp_socket"]

[tool.mypy]
python_version = "3.10"
files = ["vault_ip.py", "vault_udp_encryption.py", "vault_udp_socket_helper.py", "vault_udp_socket.py"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["msgpack.*", "pyzstd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
