[tool.mypy]
python_version = "3.10"
files = ["vault_ip.py", "vault_udp_encryption.py", "vault_udp_socket_helper.py", "vault_udp_socket.py"]
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

# __init__.py lives in a directory whose name ("py-vault-udp") is not a valid
# Python identifier, so mypy cannot resolve its relative imports as a package.
exclude = ["^__init__\\.py$"]

[[tool.mypy.overrides]]
module = ["msgpack.*", "PySignal.*", "pyzstd.*"]
ignore_missing_imports = true

# pytest config lives in tests/pytest.ini: pytest must not treat this
# directory as its rootdir, since collecting it walks through __init__.py
# (see the comment on tool.mypy.exclude above) and fails to import it.
